# IAOS — Gate 2 CI. Offline deterministic verification only.
#
# WHAT THIS DOES
#   Bootstraps from a clean runner, typechecks and builds the app, then runs the
#   three offline runners: 53 calculation-core checks, 169 resolver / view-model
#   checks, and 86 Netlify-observer checks. All three assert an exact floor, so
#   an added or removed case fails the run rather than passing quietly.
#
# GATE 4B-4 (2026-08-19) — THE IDENTIFIER BOUNDARY, AND WHY ITS SCOPE STOPS
#   scripts/test-identifier-boundary.cjs asserts that no GoHighLevel-shaped
#   identifier literal exists in deployed application source outside
#   app/shared/ghl-config.ts. Gates 4B-2 and 4B-3 centralized every one of them;
#   without an assertion that is a convention rather than a boundary, and the
#   next feature reopens it one pasted id at a time.
#
#   Scope is the PRODUCTION RUNTIME BOUNDARY — app/src, app/netlify, app/shared,
#   netlify/functions, client/src, shared — which is what the two netlify.toml
#   files actually deploy. All six must exist; a missing one is a hard failure,
#   because a silently skipped directory is a silently unguarded one.
#
#   app/scripts AND scripts ARE NOT SCANNED, and that is not an exemption. Those
#   harnesses do reach production and do pin production identifiers, so they are
#   genuinely part of environment safety — but their binding is an ORIGIN and a
#   CREDENTIAL, not a literal compiled into a deployed artifact. The control that
#   fits them is the staging origin and test location created at Gate 4C. Two
#   control planes; neither is exempt.
#
#   There is also a real false positive. scripts/netlify-status.cjs holds two
#   36-character UUIDs which are NETLIFY SITE IDS with no GoHighLevel
#   relationship at all. A UUID is a UUID whoever issued it, so scanning that
#   tree would flag the Gate 3 deployment observer — and excluding it by name
#   would read as "this file may hold GHL ids", which is the opposite of true.
#
#   FLOOR 9 IS AUTHORED AND LOCKED. It moves only by deliberate addition or
#   removal with a stated reason, never by back-filling from a result. It is
#   deliberately not one-check-per-file: that floor would drift whenever anyone
#   added a file and would stop meaning anything.
#
# GATE 4B-2b (2026-08-19) — WHY THE ROOT-FUNCTION TYPECHECK IS SCOPED
#   netlify/functions/motivation-score.ts and phone-lookup.ts were typechecked by
#   NOTHING. The root tsconfig includes only client/src, shared/ and server/; the
#   app tsconfig covers app/netlify; and this workflow builds app/ alone. Gate
#   4B-3 introduces the repository's first root->app/ import into one of those
#   files, so without a check CI could not fail a wrong import path or property
#   name before it reached a live unauthenticated production writer.
#
#   DO NOT "SIMPLIFY" THIS INTO `pnpm check`. That script DOES NOT PASS TODAY.
#   OBSERVED at 5dfe9b2 with the full root dependency tree installed: two errors,
#   both TS2339 "Property 'external' does not exist", both in
#   client/src/components/Navigation.tsx, both pre-existing and unrelated. Wiring
#   the root check in would require editing the marketing site's PUBLISHED client
#   to make this gate green — a production code change in service of a CI step.
#   Those two errors are BACKLOG, deliberately unfixed here.
#
#   typeRoots in netlify/functions/tsconfig.json is LOAD-BEARING, not decoration.
#   tsc resolves `types: ["node"]` by walking up from the tsconfig's OWN
#   directory, which from netlify/functions never reaches app/node_modules/@types
#   — and this workflow installs app dependencies only. Without the explicit list
#   the step fails TS2688 "Cannot find type definition file for 'node'" every
#   single time — a permanently red gate that reads as broken code. Both paths
#   are listed so it resolves whether root or app dependencies are present.
#
#   SCOPE, stated precisely: `include` bounds the ENTRYPOINT set to root Netlify
#   functions. Imported dependencies are still typechecked TRANSITIVELY —
#   TypeScript follows ../../app/shared/ghl-config into app/ regardless of
#   include, which is exactly what makes a wrong property name fail. What the
#   scoping buys is only that client/, server/ and shared/ are never entrypoints,
#   so this check cannot inherit their current debt. It does NOT promise
#   immunity from future transitive debt.
#
# GATE 3.1 (2026-08-19) — WHY THE OBSERVER SUITE IS HERE AND THE OBSERVER IS NOT
#   "No Netlify" below is a real exclusion and it still holds. It covers
#   scripts/netlify-status.cjs, which calls the Netlify API and stays out of this
#   workflow. It does NOT cover scripts/netlify-status.test.cjs, which is the pure
#   classify() half of that module driven by the twelve JSON fixtures in
#   scripts/fixtures/ and never reaches the network.
#
#   That suite was not dispositioned either way when this workflow was written,
#   for a reason simpler than any reading of these comments: this file was last
#   touched at 2846f07 and the observer landed at a6de5f5, the following day. The
#   workflow predates the thing it would have had to exclude.
#
#   Direct requires are node:fs, node:path and the module under test. Loading the
#   module under test also pulls in node:child_process, which is used for `gh`
#   inside functions and is never executed by the suite. No install, no network,
#   no secrets. It has no dependency on any step above it and would pass in first
#   position; it is placed last for narrative order only.
#
#   SCOPE OF THE GUARANTEE, stated honestly: the suite's static assertions bound
#   fetch and http-client imports. They do NOT bound subprocess use — an edit that
#   shelled out via execFileSync would pass all 86 checks. Closing that is Gate
#   3.2 and is deliberately not attempted in this commit.
#
# WHAT THIS DELIBERATELY DOES NOT DO
#   No production reach. No secrets. No GoHighLevel. No Netlify. No deployment.
#   No Playwright and no live harnesses — verify-contacts, verify-conversations,
#   verify-dashboard and verify-underwriting all drive a browser against the
#   deployed site and are out of scope.
#
#   verify-proxy-boundary.cjs is ALSO out of scope, and that is deliberate. It is
#   Node-only and browserless but it is NOT offline: it calls IAOS_ORIGIN, whose
#   default is production, and four of its ten probes are write-method requests.
#   Running it per-commit would make this workflow a standing route from
#   development into production. It joins automated verification once a staging
#   origin exists; production execution stays an explicitly authorized
#   post-deploy job.
#
# VITE_IAOS_ENV IS NOT SET HERE, ON PURPOSE
#   OBSERVED 2026-08-18 on a clean runner at fca9edc: with the selector set to
#   "production" the build emits index-ROFH729Z.js at 372.46 kB, byte-matching
#   what production serves; unset, it emits index-DMGAm8ca.js at 370.65 kB. The
#   selector is baked in at build time by Vite, and app/.env is gitignored, so a
#   clean clone cannot reproduce the production artifact. This workflow treats
#   the build as a COMPILE CHECK, not as a promotable artifact, so it leaves the
#   selector unset and keeps CI free of production configuration. Do not read
#   this job's bundle hash as evidence about production. Corroborated from two
#   machines: a bare runner with no selector produced the first hash, and a
#   developer machine where app/.env sets it produced the second.
#
# PNPM VERSION COMES FROM packageManager. DO NOT ADD A version INPUT.
#   OBSERVED 2026-08-18, CI run #1 on ec3dd32 failed in 0s at Set up pnpm:
#     Multiple versions of pnpm specified:
#       - version 10.4.1 in the GitHub Action config with the key "version"
#       - version pnpm@10.4.1+sha512... in the package.json with the key
#         "packageManager"
#   pnpm/action-setup@v4's bundled dist compares d.replace("pnpm@","") against
#   the version input, WITHOUT stripping the +sha512 integrity suffix, so an
#   exactly-matching version still throws. The fix on master adds
#   .split('+')[0]; the v4 tag does not carry it. Root package.json declares
#   pnpm@10.4.1, so omitting the input lets the action read it from there —
#   single source of truth, and no conflict to resolve.
#   app/pnpm-lock.yaml is lockfileVersion 9.0. The whole sequence was verified
#   on a clean runner with pnpm 10.28.0; if 10.4.1 behaves differently against
#   that lockfile it is a real finding, not a reason to widen scope.
#
# KNOWN NON-BLOCKING WARNING
#   actions/checkout@v4 and pnpm/action-setup@v4 target Node 20, which GitHub
#   has deprecated and now force-runs on Node 24. Advisory only, and left
#   unaddressed deliberately to keep this change minimal.

name: CI

# Every push, on every branch. pull_request is deliberately absent: this repo
# has no PR workflow today, so adding it would only produce duplicate runs for
# same-repo branches. Add it when PRs actually enter the process.
on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be installed before setup-node, or the pnpm cache cannot
      # resolve its store path.
      # No version input, deliberately — see the header. The version is read
      # from root package.json's packageManager field.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install app dependencies
        run: pnpm install --dir app --frozen-lockfile

      - name: Install and verify PDF text extraction
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          command -v pdftotext
          pdftotext -v

      - name: PDF adapter offline validation
        run: node app/scripts/test-generate-contract-pdf-adapter.cjs

      - name: INV-67 PDF geometry cache validation
        run: node app/scripts/test-inv67-pdf-geometry-cache.cjs

      # Board #9 Phase B packaging correction. Bundles ghl-write.ts and
      # generate-contract-pdf.ts with esbuild (mirroring Netlify's own
      # function bundler) and executes the REAL packaged artifact -- not
      # the TypeScript require shim every other suite here uses. Catches
      # exactly the class of regression that shipped past every other
      # check in this workflow: a module-scope require of the PDF runtime
      # 502'd ghl-write.ts on every request, including unauthenticated
      # ones, in a real deploy-preview.
      - name: Board #9 Phase B PDF runtime packaging validation
        run: node app/scripts/test-inv67-pdf-packaging.cjs

      - name: Typecheck and build
        run: pnpm --dir app build

      - name: Calculation core — 63 checks
        run: node app/scripts/test-underwriting-core.cjs

      - name: Board 15 B4 operator copy and labels — 48 offline checks
        run: node app/scripts/test-b15-operator-copy-b4.cjs

      - name: Resolver and view model — 169 checks
        run: node app/scripts/test-underwriting-resolver.cjs

      - name: Repair estimator operator model, incl. 2026-10-04 itemized unanswered allowances — 276 offline checks
        run: node app/scripts/test-repair-operator.cjs

      - name: Repair estimate rendered (Underwriting and Deal Calculator share it; PR 124 review) — 23 offline checks
        run: node app/scripts/test-repair-estimate-rendered.cjs

      - name: Rail — 94 offline checks
        run: node app/scripts/test-rail.cjs

      - name: Board 15 navigation-only paths (Pass 1 F19, F24, F16, F54, F44, F12) — 17 offline checks
        run: node app/scripts/test-b15-navigation.cjs

      - name: Voice foundation and recovery — 77 offline checks
        run: node app/scripts/test-voice-foundation.cjs

      - name: Board 15 B5 sign-in presentation and hidden empty pages — 28 offline checks
        run: node app/scripts/test-b15-signin-pages.cjs

      - name: Board 15 cleanup (internal references, Unnamed contact, expired-session recovery) — 42 offline checks
        run: node app/scripts/test-b15-cleanup.cjs

      - name: Seller Call calling options — 49 offline checks
        run: node app/scripts/test-seller-call-voice-controls.cjs

      - name: Board 15 B3 Seller Call content (Pass 1 F29-F37, F41, F43, F55) — 20 offline checks
        run: node app/scripts/test-b15-seller-call.cjs

      - name: Current Offer save coordinator — serialized per deal, unresolved block, protected Accept (PR 126) — 67 offline checks
        run: node app/scripts/test-current-offer-save-coordinator.cjs

      - name: Current Offer refusal release - a definitive refusal releases the page's own reservation (B14-13) - 17 offline checks
        run: node app/scripts/test-current-offer-refusal-release.cjs

      - name: Current Offer handoff under eventual reads - the deployed edge (no strong reads, stale cache); reserve then save after Check again and Enable saving (B14-13) - 14 offline checks
        run: node app/scripts/test-current-offer-eventual-reads.cjs

      - name: Current Offer handoff when cached misses persist - begin reads no new reservation key before writing it; remaining stale reads refuse without sending and are logged (B14-13) - 17 offline checks
        run: node app/scripts/test-current-offer-persistent-misses.cjs

      - name: Durable Current Offer barrier — real ghl-write and barrier handlers, reloads, late handlers, storage failures (PR 126 stacked server PR) — 45 offline checks
        run: node app/scripts/test-current-offer-barrier.cjs
      - name: Current Offer barrier suite — completion guard proof (normal / assertion failure / unsettled await / premature exit) — 6 checks
        run: node app/scripts/test-current-offer-barrier-exit-guard.cjs

      - name: Durable call-log operations (lifecycle v3) — real ghl-write and call-log handlers, D1/D2 two-browser orderings, stale calls, storage failures, legacy records, review findings B1-B3 (PR 131) — 47 offline checks
        run: node app/scripts/test-call-log-barrier.cjs
      - name: Shared receipt helpers — recorded outcomes, no SDK retries, release failures (pinned SDK) — 34 offline checks
        run: node app/scripts/test-shared-receipts.cjs

      - name: Seller Call deal bar, incl. recorded Current Offer note (Pass 1 F31, PR 126 re-reviews) — 42 offline checks
        run: node app/scripts/test-seller-call-deal-bar.cjs

      - name: Next best question, incl. operator checklist routing (Pass 1 F34) — 66 offline checks
        run: node app/scripts/test-next-best-question.cjs

      - name: Call log, call-outcome wording, queue placement, contact isolation and Do Not Call wiring — 84 offline checks
        run: node app/scripts/test-call-outcome-copy.cjs

      - name: Pipeline stage display list covers every configured stage — 10 offline checks
        run: node app/scripts/test-pipeline-stage-display.cjs

      - name: Board 15 operator copy stays true (Pass 1 findings) — 10 offline checks
        run: node app/scripts/test-b15-operator-copy.cjs

      - name: Calendars explains a GHL permission refusal instead of raw JSON — 13 offline checks
        run: node app/scripts/test-calendar-unavailable.cjs

      - name: Netlify observer — 86 offline checks
        run: node scripts/netlify-status.test.cjs

      # B14-13 (AirDroid primary calling): the browser-side launch-link builder. Offline.
      # The Windows helper's own parser checks run only on Windows and are reported as
      # skipped here; this runner has no AirDroid and touches nothing.
      - name: AirDroid Prepare Call launch link (B14-13)
        run: node app/scripts/test-airdroid-prepare-call.cjs

      # AirDroid call eligibility (Bones-accepted head 1798366): the decision rule, the read-only
      # call-eligibility function with a mocked fetch, and the browser-side response/gate logic.
      # Offline: every provider request is a fixture; no GHL, network or launch is involved.
      - name: AirDroid call eligibility rule — 87 offline checks
        run: node app/scripts/test-call-eligibility-rule.cjs
      - name: AirDroid call eligibility function — 28 offline checks
        run: node app/scripts/test-call-eligibility-endpoint.cjs
      - name: AirDroid call eligibility client state — 53 offline checks
        run: node app/scripts/test-airdroid-eligibility-state.cjs

      # B15 Batches 1-7 (Bones-approved heads 17a1252, 4e4e7f9, eccffae, 3134839, 20e9f4f,
      # 0ba74f2, 197fbbd), offline suites. Storage v2's suites are not part of this release.
      - name: Conversations email links (real host, bidi stripped; INV-132, B15-23)
        run: node app/scripts/test-message-links.cjs
      - name: Conversations GHL hand-off buttons (INV-132, B15-23)
        run: node app/scripts/test-b15-conversations-ghl-buttons.cjs
      - name: Deal Calculator spread status (INV-134, B15-26)
        run: node app/scripts/test-deal-calculator-bar.cjs
      - name: Deal Calculator wiring
        run: node app/scripts/test-deal-calculator-wiring.cjs
      - name: Pipeline property address (INV-108, B15-09)
        run: node app/scripts/test-pipeline-property.cjs
      - name: GHL shortcuts (Add Leads, Calendars; INV-125, B15-07)
        run: node app/scripts/test-b15-ghl-shortcuts.cjs
      - name: Current-read ownership helper (INV-108, B15-09)
        run: node app/scripts/test-current-read.cjs
      - name: Mailers This Week is the current Saturday-Friday week (INV-110, B15-12)
        run: node app/scripts/test-mailer-week.cjs

      # B15 bundle excluding B15-04 (accepted heads 5280263, 88e5f70, f0f4269, c0f33bc, 6e3bbde, 744be99,
      # contact-isolation 3259aca + 23770f6). Offline. No B15-04 / supplemental-read-budget step: that code is not here.
      - name: System note summaries (INV-126, B15-17)
        run: node app/scripts/test-system-note-summary.cjs
      - name: B15 display follow-ups, Disposition words + Notes header loading (Spock Addendum 2)
        run: node app/scripts/test-b15-display-followups.cjs
      - name: Repair policy, known-only zero start (INV-100, B15-01/02)
        run: node app/scripts/test-b15-01-repair-policy.cjs
      - name: Wholesaler net proceeds (INV-134, B15-26)
        run: node app/scripts/test-wholesaler-net-proceeds.cjs
      - name: Count labels and accounting (INV-128, B15-19)
        run: node app/scripts/test-b15-19-count-accounting.cjs
      - name: Contacts stage and last call attempt columns (INV-129, B15-20)
        run: node app/scripts/test-b15-20-contacts-columns.cjs
      - name: Contract Workspace display, combined invariants and checked-in slice provenance (B15-21)
        run: node app/scripts/test-b15-21-contract-display.cjs
      # B1 Blob authority (B15-26 B1 r7 boundary r2/r3): isolated module, loopback fake service only, no real credential.
      - name: B1 Blob authority -- single-attempt conditional writes, process-local handles, forbidden transitions (INV-134) — 80 checks
        run: node app/scripts/test-blob-authority.cjs
      - name: B1 repair-save completion -- owned transport, dispatch reservation/send gate, verifier, single-use CLOSE, abandonment, reader (INV-134) — 134 checks
        run: node app/scripts/test-repair-completion.cjs

      - name: B1 repair approval integration (enabled for Test; switch-off path checked) -- committed switch, save/status handlers, server recompute, auth, duplicates, blocking, display, disabled path unchanged, Test-only scoping (INV-134) — 52 checks
        run: node app/scripts/test-repair-approval-integration.cjs
      - name: Repair save whole-save deadline (B15-26 B1, r4; pinned SDK) — 60 offline checks
        run: node app/scripts/test-repair-save-deadline.cjs

      # The real-page suites (Seller Call, Contacts, Pipeline, Mailers, shell labels) need Chromium.
      # Not retried: a failure is reported as it happened. The Pipeline suite prints its startup
      # timings and on failure dumps the browser console, page errors, failed requests and the Vite log.
      - name: Install Chromium for the real-page suites (Seller Call AirDroid, Contacts, Pipeline, Mailers, shell labels)
        run: pnpm --dir app exec playwright install --with-deps chromium
      - name: Seller Call AirDroid UI checks
        run: node app/scripts/test-seller-call-airdroid.cjs
      - name: Contacts search matches the Property Address, real page and stylesheet (INV-111, B15-11)
        run: node app/scripts/test-contacts-address-search.cjs
      - name: Pipeline current read on the real page, out-of-order responses (INV-108, B15-09)
        run: node app/scripts/test-pipeline-requests.cjs
      - name: Mailers No Address empty state on the real page (INV-110, B15-12)
        run: node app/scripts/test-mailers-empty-state.cjs
      - name: Shell labels on the real page -- no Phase A badge, Conversations heading (INV-126, B15-17)
        run: node app/scripts/test-b15-shell-labels.cjs
      - name: /map and /settings redirect to the Dashboard inside the read gate, real App (B15-18)
        run: node app/scripts/test-b15-18-map-settings-redirect.cjs
      - name: Deal Calculator itemized repairs, both Clears and transfer-once, real page (INV-100, B15-01)
        run: node app/scripts/test-deal-calculator-interaction.cjs
      - name: Incomplete repairs read as provisional, never a green Meets; numbers unchanged, real page (INV-134 B15-26, INV-100 B15-01) — 55 checks
        run: node app/scripts/test-b15-26-provisional-repairs.cjs
      - name: Get Comps stays on one line and its reason wraps below at 640/480px; wide layout unchanged, real App (Pass 1 F44) — 26 checks
        run: node app/scripts/test-b15-44-get-comps-layout.cjs
      - name: Offer Readiness decision panel starting state, loading lockout and per-deal choice, real Seller Call page (Pass 1 F33) — 31 checks, floor 24
        run: node app/scripts/test-b15-33-readiness-panel.cjs
      - name: Keyboard focus never lands under the stuck deal rail (Tab/Shift+Tab, 5 widths, resize without reload, rail growth, away/back) and header chips wrap, real App (narrow-width F3/F1) — 379 checks
        run: node app/scripts/test-b15-rail-focus.cjs
      - name: B1 repair approval ENABLED path on the real page, offline (committed switch on for Test; legacy viewer served the switch-off capability) (INV-134) — 81 checks
        run: node app/scripts/test-repair-approval-browser.cjs
      # Both Production negotiation settings against the real write scope and barrier rules; floor 105
      # (NB6-NB8: a live, unspent reservation for A's deal is refused on B, then writes A once; 23770f6).
      - name: Contact isolation and Production write scope, real pages (B14-12, B14-13) — 105 checks
        run: node app/scripts/test-contact-isolation.cjs

      # Not a counted runner — a typecheck. No floor, and it must not be given
      # one. See the header for why it is scoped rather than using pnpm check.
      - name: Typecheck root Netlify functions
        run: ./app/node_modules/.bin/tsc -p netlify/functions/tsconfig.json

      - name: Identifier boundary — 10 offline checks
        run: node scripts/test-identifier-boundary.cjs

      # Two steps, not one. The failure meanings differ and an operator reading
      # a CI log should know which without opening the output: static red means
      # two causes became indistinguishable or a wrapper was forked; runtime red
      # means observed behaviour diverged from what the source declares.
      - name: Exit contract, static — 9 offline checks
        run: node scripts/test-exit-contract-static.cjs

      # Executes six refusal paths and reads what the OS reports. ~45s, of which
      # ~43s is npx tsc inside ghl-config-loader (PID-keyed temp dir, so nothing
      # is reused across processes). Both truncating members live in getConfig
      # families — no carrier-only file declares a code above 86 — so that cost
      # is unavoidable if truncation is to be observed at all.
      - name: Exit contract, runtime — 37 checks
        run: node scripts/test-exit-contract-runtime.cjs

      - name: INV-95 named write boundaries and affected regressions
        run: node app/scripts/test-inv95.cjs

      - name: Contact deal stage + Contract Workspace pointer, contact-change guards (Pass 1 F38, PR 129) — 17 offline checks
        run: node app/scripts/test-contact-deal-status.cjs
